name: Weekly health

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-health:
    name: Offline install, tests, and fake benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      RAG_PROVIDER: fake
      RAG_EMBEDDING_MODEL: fake-hash-v3-d4096-s42
      RAG_GENERATION_MODEL: fake-generation-v1

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock
          python -m pip install --editable . --no-deps

      - name: Run offline test suite
        run: python -m pytest

      - name: Run deterministic fake-provider benchmark
        run: >
          python -m rag_agent_eval_toolkit.cli benchmark
          --config configs/benchmark.yaml
          --provider fake

      - name: Verify benchmark artifacts
        shell: bash
        run: |
          test -s results/summary.csv
          test -s results/report.md
          test "$(find results -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 4
