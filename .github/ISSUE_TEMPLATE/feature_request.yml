name: Feature request
description: Propose a focused extension connected to the project mission.
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What portfolio-relevant problem would this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Connection to project scope
      options:
        - RAG or retrieval
        - Agent tools
        - Evaluation or benchmarking
        - Testing, security, or automation
        - Documentation or usability
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Test and benchmark impact
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Willing to contribute?
      options:
        - "Yes"
        - "No"
        - "Maybe, with guidance"
